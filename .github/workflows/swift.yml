name: Build BarebonesPDF

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build BarebonesPDF
        run: |
          xcodebuild \
            -project BarebonesPDF.xcodeproj \
            -scheme BarebonesPDF \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package application
        run: |
          ditto -c -k \
            --sequesterRsrc \
            --keepParent \
            "$RUNNER_TEMP/DerivedData/Build/Products/Debug/BarebonesPDF.app" \
            "$RUNNER_TEMP/BarebonesPDF-macOS.zip"

      - name: Upload compiled application
        uses: actions/upload-artifact@v4
        with:
          name: BarebonesPDF-macOS
          path: ${{ runner.temp }}/BarebonesPDF-macOS.zip
          if-no-files-found: error
